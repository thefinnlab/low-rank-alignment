encoding:
  data_root: data/
  model: gpt2xl
  layer: 24
  offset: 0
  subjects: null
  run_name: null
  batch: false
output_dir: null
svd_output_dir: null
n_directions: null
k_values: [1, 2, 5, 10, 20, 50, 100, 200, 400, 800, 1600]
threshold: 0.95
mode: per_region
atlas_path: atlases/destrieux_2009/destrieux2009_rois_lateralized.nii.gz  # set to local .nii.gz path for offline use; null = download via nilearn
atlas_region_groups:
  EAC: # Early Auditory Cortex
    - L G_temp_sup-G_T_transv
    - R G_temp_sup-G_T_transv
    - L S_temporal_transverse
    - L G_temp_sup-Plan_tempo
  STG: # Superior Temporal Gyrus
    - L G_temp_sup-Lateral
    - R G_temp_sup-Lateral
    - L S_temporal_sup
    - R S_temporal_sup
  IFG: # Inferior Frontal Gyrus
    - L G_front_inf-Opercular
    - R G_front_inf-Opercular
    - L G_front_inf-Triangul
    - R G_front_inf-Triangul
    - L G_front_inf-Orbital
    - R G_front_inf-Orbital
  PRC: # Precentral Gyrus (Motor)
    - L G_precentral
    - R G_precentral
    - L S_precentral-inf-part
    - L S_precentral-sup-part
    - L G_and_S_subcentral # Often grouped with lower motor/somatosensory
  MFG: # Middle Frontal Gyrus
    - L G_front_middle
    - R G_front_middle
    - L S_front_inf
  TMP: # Temporal Pole
    - L Pole_temporal
    - R Pole_temporal
    - L G_temp_sup-Plan_polar
