analysis_name: podcast_cross_dataset_spaces
output_root: results/subspace_comparisons
evaluation_dataset: podcast
max_rank: 128
include_pca: false
geometries: [span, weighted]
shared_corr_threshold: 0.2
rsm_metric: cosine
refresh: false

# The aliases below are used both in each model's datasets list and in the
# heatmap hierarchy. `ieeg_words` uses saved neural-analysis word selections and
# outer folds. `fmri_words` evaluates ordinary word embeddings from held-out
# fMRI stories, without Lanczos resampling or FIR expansion.
datasets:
  podcast:
    loader: ieeg_words
    dataset: podcast
    data_root: data/
    results_root: results
    subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]

  cars-2:
    loader: ieeg_words
    dataset: brain_treebank
    data_root: data/brain-treebank
    results_root: results
    per_dataset_config:
      movie: cars-2
    subjects: [3, 7, 10]
    shared_word_selection: true

  fmri:
    loader: fmri_words
    results_root: results
    fmri_repo_root: data/deep-fMRI-dataset
    embedding_root: data/fmri/stimuli
    sessions: [1, 2, 3, 4, 5]
    pooling: mean
    num_folds: 5

# Keys are canonical embedding/result directory names. Each object deliberately
# has only offsets, layers, and factor-generating datasets.
models:
  gpt2:
    offsets: [0]
    layers: [0, 3, 6, 9, 12]
    datasets: [podcast, cars-2, fmri]

  gpt2-xl-batch:
    offsets: [0]
    layers: [0, 12, 24, 36, 48]
    datasets: [podcast, cars-2, fmri]

  gpt-j-6b:
    offsets: [0]
    layers: [0, 7, 14, 21, 28]
    datasets: [podcast, cars-2, fmri]

  llama3-8b:
    offsets: [0]
    layers: [0, 8, 16, 24, 32]
    datasets: [podcast, cars-2, fmri]

  roberta-large:
    offsets: [0]
    layers: [0, 6, 12, 18, 24]
    datasets: [podcast, cars-2, fmri]

  random-gpt2-xl:
    offsets: [0]
    layers: [0, 12, 24, 36, 48]
    datasets: [podcast, cars-2, fmri]
