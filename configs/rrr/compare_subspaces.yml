output_name: subspace_reproducibility
cca_ranks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
#   - 64
#   - 128
rsa_ranks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 128
shared_corr_threshold: 0.2
rsm_metric: cosine
refresh: true
save_ambient_axes: false
save_rsm_vectors: false
include_self: false

runs:
  - name: podcast_gpt2xl_l0
    rrr_config: configs/rrr/gpt2-xl/cross_subject.yml
    unit_dir: results/gpt2-xl-batch_layer0_offset0/rrr

  - name: podcast_gpt2xl_l24
