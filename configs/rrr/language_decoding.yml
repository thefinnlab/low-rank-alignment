encoding:
  data_root: data/
  dataset: podcast
  model: transformer
  offset: 0
  subjects: null
  num_folds: 5
  ridge_cv_folds: 5
  per_model_config:
    model_dir: gpt2-xl-batch
    layer: 24

# May point directly to a unit containing fold_*/A.npy or to its parent run root.
rrr_run_path: results/gpt2-xl-batch_layer24_offset0/rrr
# Optional PCA comparison source with the same saved fold_*/A.npy layout.
pca_run_path: null
mode: within_dataset
source_name: podcast_gpt2-xl-batch_layer24
fold_results_dir: null
output_dir: null

rank_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 1600]
tasks:
  - part_of_speech
  - content_word
  - surprisal
  - entropy
  - surprisal_class
  - story_position
  - story_time_position
  - sentence_onset
  - sentence_end
  - iu_onset
  - iu_end
  - sentence_position
  - sentence_length
  - iu_position
  - iu_length
  - pre_word_pause
  - fine_part_of_speech
  - word_duration
  - word_length
  - word_zipf_frequency

task_data:
  word_annotations: processed_data/df_word_onset_with_pos_class.csv
  sentence_annotations: processed_data/all_sentences_podcast.csv
  iu_annotations: processed_data/iu_boundaries.csv

logistic_cs: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
refresh: false
