encoding:
  dataset: deep-fmri
  model: transformer
  offset: 0
  per_model_config:
    model_dir: gpt2-xl-batch
    layer: 24

results_root: results
rrr_source:
  mode: internal
  dataset: deep-fmri
  offset: 0
  model: gpt2-xl-batch
  layer: 24
  significance_selection:
    mode: within-layer
    reference_artifact:
      mode: held_out_session
      dataset: deep-fmri
      offset: 0
      model: gpt2-xl-batch
      layer: 24

# Set fmri_tr_pre_fir to false for the original pooled-word analysis.
# True uses Lanczos-aligned current-TR representations matching pre-FIR inputs.
mode: within_dataset
fmri_tr_pre_fir: true
device: auto
rank_grid: [1, 2, 4, 8, 16, 32, 64, 128]

tasks:
  - surprisal
  - self_surprisal
  - word_zipf_frequency
  - word_length
  - content_word
  - part_of_speech
  - sentence_position
  - sentence_onset
  - sentence_end
  - word_duration
  - pre_word_pause
  - post_word_pause
  - concreteness
  - valence
  - arousal
  - dependency_depth
  - dependency_length
  - iu_position
  - iu_onset
  - iu_end
  - iu_length

task_data:
  language_features: processed_data/language_features/fmri
  self_surprisal_root: processed_data/language_features/self_surprisal/{model}/fmri

refresh: false
