encoding:
  data_root: data/
  dataset: podcast
  model: transformer
  offset: 0
  subjects: null
  num_folds: 5
  ridge_cv_folds: 5
  per_model_config:
    model_dir: gpt2-xl-batch
    layer: 24

# May point directly to an RRR unit or to a run root containing rrr/. The
# corresponding PCA sibling is resolved automatically and is required.
rrr_run_path: results/gpt2-xl-batch_layer24_offset0/rrr
mode: within_dataset
source_name: podcast_gpt2-xl-batch_layer24
fold_results_dir: null
output_dir: null
subspace_aggregation: extrinsic

rank_grid: [1, 2, 4, 8, 16, 32]
tasks:
  - part_of_speech
  - content_word
  - surprisal
  - entropy
  - sentence_position
  - iu_position
  - word_zipf_frequency
  - is_named_entity
  - is_coreference_mention

# Leave empty to use processed_data/language_features/{dataset}/{stimulus}/tokens.tsv.
task_data: {}
target_views: [weighted, span]
ridge_alphas: null

save_models: false
refresh: false
