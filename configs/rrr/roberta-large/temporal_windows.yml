encoding:
  data_root: data/
  model: transformer
  offset: 0
  subjects: null
  per_model_config:
    model_dir: roberta-large
    layer: [0, 6, 12, 18, 24]
mode: temporal_windows
temporal_windows:
  - {name: pre_word, start_sec: -2.0, end_sec: 0.0}
  - {name: post_word, start_sec: 0.0, end_sec: 2.0}
rank_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
refresh: true
run_pca_baseline: true
