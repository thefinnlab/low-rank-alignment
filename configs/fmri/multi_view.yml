fmri:
  ridge:
    alphas: null
    alpha_grid: {}
    solver_params: {n_targets_batch: 4096, n_targets_batch_refit: 4096}
    y_in_cpu: true
    force_cpu: false
    log_alphas: true
  banded_ridge_alphas: null
