fmri:
  fmri_repo_root: data/deep-fMRI-dataset
  embedding_root: data/fmri/stimuli
  sessions: [1, 2, 3, 4, 5]
  subjects: [UTS01,UTS02,UTS03,UTS04,UTS05,UTS06,UTS07,UTS08,UTS09]
  trim: 5
  ndelays: 4

ridge:
  alphas: null
  alpha_grid: {}
  solver_params:
    n_targets_batch: 8192
    n_targets_batch_refit: 8192
  y_in_cpu: true
  force_cpu: false
  log_alphas: true

model_dir: gpt2-xl
layer: 24
pooling: mean
significance_dir: results/fmri/gpt2-xl_layer24/significance

# Learn RRR factors directly from the full fMRI FIR ridge model. The shared
# test story remains held out from the ridge, RRR, aggregation, and PCA fits.
source_mode: within_fmri

# extrinsic gives every FIR-delay subspace equal weight. Set this to
# unnormalized to preserve the magnitude of each raw delay-specific factor.
subspace_aggregation: extrinsic

# Compute only the requested leading RRR components on GPU. This avoids
# materializing every right singular vector of the very wide voxel matrix.
rrr_svd_on_cpu: false
rrr_use_low_rank_svd: true
rrr_low_rank_svd_seed: 0

# Not used by source_mode=within_fmri, but retained as null to make that explicit.
source_rrr_unit_dir: null
output_dir: results/fmri/gpt2-xl_layer24/within_fmri_rrr

rank_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 1600]
refresh: true
