dataset: fmri
device: auto
refresh: false
feature_root: processed_data/language_features/fmri

# These columns are present for every retained training story and the shared held-out
# story. Decoder regularization uses leave-one-session-out CV on training stories;
# final metrics are reported only on wheretheressmoke.
tasks:
  - surprisal
  - word_zipf_frequency
  - word_length
  - content_word
  - part_of_speech
  - sentence_position
  - sentence_onset
  - sentence_end
  - word_duration
  - pre_word_pause
  - post_word_pause
  - concreteness
  - valence
  - arousal
  - dependency_depth
  - dependency_length
  - iu_position
  - iu_onset
  - iu_end
  - iu_length

models:
  gpt-j-6b:
    rrr_config: configs/cross_dataset/fmri/within/gpt-j-6b.yml
    result_template: results/fmri/gpt-j-6b_layer{layer}/within_fmri_rrr
  gpt2-xl:
    rrr_config: configs/cross_dataset/fmri/within/gpt2-xl.yml
    result_template: results/fmri/gpt2-xl_layer{layer}/within_fmri_rrr
  llama3-8b:
    rrr_config: configs/cross_dataset/fmri/within/llama3-8b.yml
    result_template: results/fmri/llama3-8b_layer{layer}/within_fmri_rrr
  roberta-large:
    rrr_config: configs/cross_dataset/fmri/within/roberta-large.yml
    result_template: results/fmri/roberta-large_layer{layer}/within_fmri_rrr
  random-gpt2-xl:
    rrr_config: configs/cross_dataset/fmri/within/random-gpt2-xl.yml
    result_template: results/fmri/random-gpt2-xl_layer{layer}/within_fmri_rrr
  gpt2:
    rrr_config: configs/cross_dataset/fmri/within/gpt2.yml
    result_template: results/fmri/gpt2_layer{layer}/within_fmri_rrr
