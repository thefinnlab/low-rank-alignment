encoding:
  data_root: data/
  model: gpt2xl
  layer: 24
  offset: 0
  subjects: null
  run_name: null
  batch: false

output_dir: null
sae_output_dir: null
rrr_source_dir: null
mode: per_subject
track_recovery_during_training: true

# RRR rank to load
k: [10, 20, 50, 100]

# SAE architecture
hidden_dim: [50, 100, 500, 1000]
l1_penalty: 0.0
l1_warmup_start: 20            # epoch/cycle to begin L1 ramp (0 = immediate)
l1_warmup_epochs: 90           # epochs/cycles to linearly ramp L1 to target (0 = no ramp)

# Training mode: "end_to_end" or "alternating"
training_mode: alternating
regression_type: ridge    # "ols" or "ridge"

# End-to-end params
learning_rate: 0.0001
num_epochs: 2000
batch_size: null
log_every: 100             # compute & display test metrics every N epochs/cycles

# Alternating params
sae_learning_rate: 0.0001
sae_steps_per_cycle: 1
num_cycles: 1000
regression_momentum: 0.2      # proximal damping: W = (1-η)W_old + η*W_optimal (1.0 = no damping)

# Input jitter (Gaussian noise on X_proj during SAE training, 0 = disabled)
input_jitter_std: 0.1

# Dead feature resampling (0 = disabled)
resample_interval: 0

# Norm-weighted L1 (Anthropic 2024): weight L1 by regression column norms
# to prevent activation shrinkage / weight inflation
weight_l1_by_decoder_norm: true

# Subject/region limiting (null = run all)
max_subjects: null
max_regions: null
