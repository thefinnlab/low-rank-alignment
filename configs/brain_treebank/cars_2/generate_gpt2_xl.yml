# Cars 2 Brain Treebank stimulus: subjects 3, 7, and 10 watched this movie.
hf_model_id: openai-community/gpt2-xl
output_name: gpt2-xl
data_root: data/brain-treebank
dataset: brain_treebank
per_dataset_config:
  movie: cars-2
context_window: 1024
stride: 512
layers: all
pooling: mean
