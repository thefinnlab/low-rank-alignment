encoding:
  data_root: data/brain-treebank
  dataset: brain_treebank
  per_dataset_config: {movie: cars-2}
  model: glove
  offset: 0
  subjects: [3, 7, 10]
  num_folds: 5
  shared_word_selection: true
  per_model_config:
    dim: 300
  ridge_alphas: [10.0, 21.5, 46.4, 100.0, 215.4, 464.2, 1000.0, 2154.4, 4641.6, 10000.0, 21544.0, 46415.0, 1.0e10]
mode: temporal_windows
temporal_windows:
  - {name: pre_word, start_sec: -2.0, end_sec: 0.0}
  - {name: post_word, start_sec: 0.0, end_sec: 2.0}
rank_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 300]
refresh: true
run_pca_baseline: true
