dataset: brain_treebank
mode: internal
results_root: results
plot: true
refresh: true
rank_grid:
- 1
- 2
- 4
- 8
- 16
- 32
- 64
- 128
- 256
- 512
- 1024
- 2048
significance_selection:
  mode: cross-model-layer
  reference_artifact:
    mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: pythia-1.4b
    layer: '{layer}'
  artifacts:
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt-j-6b
    layer: [0, 7, 14, 21, 28]
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt2-xl-batch
    layer: [0, 12, 24, 36, 48]
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: llama3-8b
    layer: [0, 8, 16, 24, 32]
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: roberta-large
    layer: [0, 6, 12, 18, 24]
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: random-gpt2-xl
    layer: [0, 12, 24, 36, 48]
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt2
    layer: [0, 3, 6, 9, 12]
ieeg:
  encoding:
    data_root: data/brain-treebank
    per_dataset_config:
      movie: cars-2
    model: transformer
    offset: 0
    subjects:
    - 3
    - 7
    - 10
    batch: false
    num_folds: 5
    shared_word_selection: true
    per_model_config:
      model_dir: pythia-1.4b
      layer:
      - 0
      - 12
      - 24
  run_pca_baseline: true
  run_null_augmented: false
  null_augmented_repeats: 50
  null_augmented_reference_rank: 2048
  null_augmented_min_shift: 50
  null_augmented_seed: 42
fmri: null
