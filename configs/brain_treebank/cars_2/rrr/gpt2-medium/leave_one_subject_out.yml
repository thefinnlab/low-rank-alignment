dataset: brain_treebank
mode: leave_one_subject_out
results_root: results
plot: true
refresh: false
rank_grid:
- 1
- 2
- 4
- 8
- 16
- 32
- 64
- 128
- 256
- 512
- 1024
significance_selection:
  mode: cross-model-layer
  reference_artifact:
    mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt2-medium
    layer: '{layer}'
    variant: rereference-laplacian
  artifacts:
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt2
    layer:
    - 0
    - 3
    - 6
    - 9
    - 12
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt2-xl-batch
    layer:
    - 0
    - 12
    - 24
    - 36
    - 48
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: gpt-j-6b
    layer:
    - 0
    - 7
    - 14
    - 21
    - 28
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: roberta-large
    layer:
    - 0
    - 6
    - 12
    - 18
    - 24
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: llama3-8b
    layer:
    - 0
    - 8
    - 16
    - 24
    - 32
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: random-gpt2
    layer:
    - 0
    - 3
    - 6
    - 9
    - 12
    variant: rereference-laplacian
  - mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: glove-300
    layer: null
    variant: rereference-laplacian
ieeg:
  encoding:
    data_root: data/brain-treebank
    per_dataset_config:
      movie: cars-2
      rereference: laplacian
    model: transformer
    offset: 0
    subjects:
    - 3
    - 7
    - 10
    batch: false
    num_folds: 5
    shared_word_selection: true
    per_model_config:
      model_dir: gpt2-medium
      layer:
      - 0
      - 12
      - 24
  run_pca_baseline: true
fmri: null
