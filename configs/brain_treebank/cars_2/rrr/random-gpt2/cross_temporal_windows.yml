dataset: brain_treebank
mode: cross_temporal_windows
results_root: results
plot: true
refresh: true
rank_grid:
- 1
- 2
- 4
- 8
- 16
- 32
- 64
- 128
- 256
- 512
- 768
significance_selection:
  mode: within-layer
  reference_artifact:
    mode: sig_lags
    dataset: brain-treebank-cars-2
    offset: 0
    model: random-gpt2
    layer: '{layer}'
    variant: rereference-laplacian
rrr_source:
  mode: temporal_windows
  dataset: brain-treebank-cars-2
  offset: 0
  model: gpt2
  layer: '{layer}'
ieeg:
  encoding:
    data_root: data/brain-treebank
    per_dataset_config:
      movie: cars-2
      rereference: laplacian
    model: transformer
    offset: 0
    subjects:
    - 3
    - 7
    - 10
    num_folds: 5
    shared_word_selection: true
    per_model_config:
      model_dir: random-gpt2
      layer:
      - 0
      - 3
      - 6
      - 9
      - 12
  temporal_windows:
  - name: pre_word
    start_sec: -2.0
    end_sec: 0.0
  - name: post_word
    start_sec: 0.0
    end_sec: 2.0
  run_pca_baseline: true
fmri: null
