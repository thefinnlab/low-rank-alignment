# Generate GPT-2-XL embeddings for one Brain Treebank movie.
# Override `per_dataset_config.movie` when running for a different stimulus.
hf_model_id: openai-community/gpt2-xl
output_name: gpt2-xl
data_root: data/brain-treebank
dataset: brain_treebank
per_dataset_config:
  movie: coraline
context_window: 1024
stride: 512
layers: all
pooling: mean
attention_mode: auto
dtype: float16
output_dtype: float16
device: cuda
batch_size: 1
local_files_only: true
add_prefix_space: true
