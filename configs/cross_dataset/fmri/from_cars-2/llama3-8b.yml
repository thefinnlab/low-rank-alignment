      dataset: brain-treebank-cars-2
      offset: 0
      model: glove-300
      layer: null
      variant: rereference-laplacian
ieeg: null
fmri:
  ridge:
    alphas: null
    alpha_grid: {}
    solver_params:
      n_targets_batch: 8192
      n_targets_batch_refit: 8192
    y_in_cpu: true
    force_cpu: false
    log_alphas: true
  model_dir: llama3-8b
  layer:
  - 0
  - 8
  - 16
  - 24
  - 32
  pooling: mean
  rrr_svd_on_cpu: false
  rrr_use_low_rank_svd: false
  rrr_low_rank_svd_seed: 0
  rrr_save_b_matrix: false
  data:
    fmri_repo_root: data/deep-fMRI-dataset
    embedding_root: data/fmri/stimuli
    limit_to_glove: true
    glove_dim: 300
    sessions:
    - 1
    - 2
    - 3
    - 4
    - 5
    subjects:
    - UTS01
    - UTS02
    - UTS03
    - UTS04
    - UTS05
    - UTS06
    - UTS07
    - UTS08
    - UTS09
    trim: 5
    ndelays: 4
