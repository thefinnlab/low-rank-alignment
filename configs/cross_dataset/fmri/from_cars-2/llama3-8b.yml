dataset: deep-fmri
mode: cross_dataset
results_root: results
plot: true
refresh: false
rank_grid:
- 1
- 2
- 4
- 8
- 16
- 32
- 64
- 128
- 256
- 512
- 1024
- 2048
- 4096
significance_selection:
  mode: cross-model-layer
  reference_artifact:
    mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: llama3-8b
    layer: '{layer}'
  artifacts:
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: gpt2
    layer:
    - 0
    - 3
    - 6
    - 9
    - 12
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: gpt2-xl-batch
    layer:
    - 0
    - 12
    - 24
    - 36
    - 48
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: gpt-j-6b
    layer:
    - 0
    - 7
    - 14
    - 21
    - 28
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: roberta-large
    layer:
    - 0
    - 6
    - 12
    - 18
    - 24
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: llama3-8b
    layer:
    - 0
    - 8
    - 16
    - 24
    - 32
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: random-gpt2
    layer:
    - 0
    - 3
    - 6
    - 9
    - 12
  - mode: held_out_session
    dataset: deep-fmri
    offset: 0
    model: glove-300
    layer: null
subspace_aggregation: extrinsic
rrr_source:
  mode: full_fit
  dataset: brain-treebank-cars-2
  rereference: laplacian
  offset: 0
  model: llama3-8b
  layer: '{layer}'
  significance_selection:
    mode: cross-model-layer
    reference_artifact:
      mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: llama3-8b
      layer: '{layer}'
      variant: rereference-laplacian
    artifacts:
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: gpt2
      layer:
      - 0
      - 3
      - 6
      - 9
      - 12
      variant: rereference-laplacian
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: gpt2-xl-batch
      layer:
      - 0
      - 12
      - 24
      - 36
      - 48
      variant: rereference-laplacian
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: gpt-j-6b
      layer:
      - 0
      - 7
      - 14
      - 21
      - 28
      variant: rereference-laplacian
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: roberta-large
      layer:
      - 0
      - 6
      - 12
      - 18
      - 24
      variant: rereference-laplacian
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: llama3-8b
      layer:
      - 0
      - 8
      - 16
      - 24
      - 32
      variant: rereference-laplacian
    - mode: sig_lags
      dataset: brain-treebank-cars-2
      offset: 0
      model: random-gpt2
      layer:
      - 0
      - 3
      - 6
      - 9
      - 12
