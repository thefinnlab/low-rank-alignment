dataset: fmri
data_root: data/deep-fMRI-dataset
per_dataset_config:
  story: alternateithicatom
model_dir: gpt2-xl
output_dir: processed_data/language_features
resource_dir: data/language_resources
provider_resource_config: configs/language_features/podcast.yml
providers:
- native
- speaker_diarization
- ud
- lexical_norms
- swow
- wordnet
- disfluency
- entity_coreference
dataset_options:
  sentence_annotations: processed_data/language_boundaries/fmri/{story}/sentence_ids.tsv
  iu_annotations: processed_data/language_boundaries/fmri/{story}/iu_boundaries.csv
provider_options:
  speaker_diarization:
    model_resource: pyannote_community_1
    device: cuda
    num_speakers: null
    min_speakers: null
    max_speakers: null
  wordnet:
    model_resource: wordnet
  lexical_norms:
    resources:
    - concreteness
    - lancaster
    - nrc_vad
    - age_of_acquisition
    - word_prevalence
    - semantic_diversity
    - socialness
  swow:
    resource: swow
  disfluency:
    max_repeated_phrase_words: 5
  entity_coreference:
    language: en
    model_resource: stanza_semantics
    ner_package: ontonotes-ww-multi_charlm
    coref_package: gum-nospeakers_roberta-large-lora
    foundation_resource: roberta_large
    use_gpu: true
  ud:
    language: en
    package: ewt
    model_resource: stanza_ewt
    use_gpu: true
resources:
  pyannote_community_1:
    type: huggingface_model
    path: pyannote/speaker-diarization-community-1
    repo_id: pyannote/speaker-diarization-community-1
    revision: main
    required_files:
    - config.yaml
  stanza_ewt:
    type: stanza_model
    path: stanza
    language: en
    package: ewt
  stanza_semantics:
    type: stanza_model
    path: stanza
    language: en
    package: ewt
    processors:
      ner: ontonotes-ww-multi_charlm
      coref: gum-nospeakers_roberta-large-lora
    required_models:
    - en/ner/ontonotes-ww-multi_charlm.pt
    - en/coref/gum-nospeakers_roberta-large-lora.pt
  roberta_large:
    type: huggingface_model
    path: transformers/roberta-large
    repo_id: FacebookAI/roberta-large
    revision: main
    allow_patterns:
    - config.json
    - model.safetensors
    - merges.txt
    - vocab.json
    - tokenizer.json
    - tokenizer_config.json
    required_files:
    - config.json
    - model.safetensors
    - merges.txt
    - vocab.json
  wordnet:
    type: nltk_corpus
    path: nltk_data
    corpus: wordnet
  concreteness:
    type: lexical_norm
    path: concreteness.csv
    manual: true
    key_column: Word
    columns:
      concreteness: Conc.M
  lancaster:
    type: lexical_norm
    path: lancaster.csv
    manual: true
    key_column: Word
    columns:
      visual_strength: Visual.mean
      auditory_strength: Auditory.mean
      haptic_strength: Haptic.mean
      olfactory_strength: Olfactory.mean
      gustatory_strength: Gustatory.mean
      interoceptive_strength: Interoceptive.mean
      hand_arm_action_strength: Hand_arm.mean
      mouth_throat_action_strength: Mouth.mean
      foot_leg_action_strength: Foot_leg.mean
      head_action_strength: Head.mean
      torso_action_strength: Torso.mean
  nrc_vad:
    type: lexical_norm
    path: nrc-vad-v2.tsv
    manual: true
    separator: "\t"
    key_column: term
    columns:
      valence: valence
      arousal: arousal
      dominance: dominance
  age_of_acquisition:
    type: lexical_norm
    path: age-of-acquisition.csv
    manual: true
    key_column: Word
    columns:
      age_of_acquisition: Rating.Mean
  word_prevalence:
    type: lexical_norm
    path: word-prevalence.csv
    manual: true
    key_column: Word
    columns:
      word_prevalence: Prevalence
  semantic_diversity:
    type: lexical_norm
    path: semantic-diversity.csv
    manual: true
    key_column: Word
    columns:
      semantic_diversity: SemD
  socialness:
    type: lexical_norm
    path: socialness.csv
    manual: true
    key_column: Word
    columns:
      socialness: Mean
  swow:
    type: association
    path: swow.csv
    manual: true
    separator: "\t"
    cue_column: cue
    response_column: response
    weight_column: R123.Strength
refresh: false
